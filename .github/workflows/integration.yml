name: integration

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main only accepts a PR whose head is develop, in this same repository
  # (release train plan, decision 2). Runs first, before lint/testing:
  # it costs nothing (no checkout, pure payload inspection) and there is
  # no reason to spend runner minutes on a full lint + 3-leg test matrix for a PR that this check is about to reject anyway.
  # Always runs and always reports a context on pull_request, so it can
  # be required on any branch without the risk of a required check that
  # never fires because its own `if:` never matched.
  train-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the PR comes from develop
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "base is '${BASE_REF}', not main; nothing to guard"
            exit 0
          fi
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PRs into main must come from this repository's develop branch (got '${HEAD_REPO}:${HEAD_REF}')."
            exit 1
          fi

  # Static checks need no Forgejo instance; they run alongside `testing`.
  lint:
    needs: [train-guard]
    # train-guard only actually runs on pull_request; on push (develop) it
    # is skipped, and by default a job that needs a skipped job is also
    # skipped. This `if:` overrides that so push still runs lint, while a
    # real train-guard failure (PR into main from the wrong branch) still
    # skips it.
    if: needs.train-guard.result == 'success' || needs.train-guard.result == 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOPROXY: "https://proxy.golang.org,direct"
      GO111MODULE: "on"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: forgejo/go.mod
          check-latest: true
          cache: false

      # Every file that pins the Forgejo test-instance version must agree.
      - run: make check-forgejo-version
      - run: make check-test-instance-settings
      - run: make vet
      - run: make ci-lint
      - run: make build
      - run: make test-unit
      # Every exported *Client method (route) needs a test.
      - run: make check-route-coverage

  # Runs the integration suite against every Forgejo line the README
  # promises support for: both currently-supported LTS releases (Forgejo
  # ships one LTS per year, on its first release; the rest are "stable"
  # with ~3 months of support — see https://forgejo.org/releases/) plus the
  # newest stable, so "supports 11.0.10+" is something CI actually checks
  # instead of an unverified claim about the versions in between.
  #
  # With the matrix, the job name GitHub Actions reports for each leg is
  # "testing (lts-11)", "testing (lts-15)", "testing (latest-stable)" — the
  # single "testing" name that used to be the required status check on
  # `main` no longer exists on its own. Branch protection needs updating to
  # require the three new names instead (administrative repo setting, not
  # something this workflow file can do by itself).
  #
  # The explicit `name:` below is what makes those names stable: without it
  # GitHub names each leg after every matrix field, image digest
  # included ("testing (codeberg.org/forgejo/forgejo:11.0.16@sha256:...,
  # lts-11)"), so the status-check context would change on every Renovate
  # bump and the required check on `main` would never match again.
  #
  # fail-fast: true trades "know immediately which legs would have failed"
  # for "stop burning runner minutes the moment any leg is red": the first
  # failing leg cancels the other two still in flight.
  testing:
    needs: [train-guard]
    if: needs.train-guard.result == 'success' || needs.train-guard.result == 'skipped'
    name: testing (${{ matrix.label }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # renovate: versioning=regex:^(?<major>11)\.(?<minor>\d+)\.(?<patch>\d+)$
          - label: lts-11
            image: codeberg.org/forgejo/forgejo:11.0.16@sha256:946243edbab116d5bb78b73ea68af6f3d69229ba1b1ed958dd82c3481167f3e0
          # renovate: versioning=regex:^(?<major>15)\.(?<minor>\d+)\.(?<patch>\d+)$
          - label: lts-15
            image: codeberg.org/forgejo/forgejo:15.0.9@sha256:91a5310c86934339e16bd06b6078aada836e3d8935b2d70f6598108cbfaed5d1
          # No version-lock marker: this entry tracks the same release as
          # Makefile/README.md/forgejo/main_test.go and is bumped by the
          # same Renovate group ("forgejo test instance") as those three.
          - label: latest-stable
            image: codeberg.org/forgejo/forgejo:16.0.5@sha256:cf5f5ae6acf2ababca0ee3d255705b83a47f35b25e07fc931d694d60664053fe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOPROXY: "https://proxy.golang.org,direct"
      GO111MODULE: "on"
      FORGEJO_SDK_TEST_URL: "http://forgejo:3000"
      FORGEJO_SDK_TEST_USERNAME: "test01"
      FORGEJO_SDK_TEST_PASSWORD: "test01"
      # Names this leg in the route report TestMain writes, which is what
      # gives ROUTES.md one column per Forgejo version.
      FORGEJO_SDK_TEST_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: forgejo/go.mod
          check-latest: true
          cache: false

      # GitHub's `services:` block cannot override the container command, and
      # this instance is configured entirely through a generated app.ini, so it
      # is started by hand. Disposable: it serves only this job and dies with
      # the runner VM. SECRET_KEY/INTERNAL_TOKEN are generated fresh below
      # instead of being fixed values committed to the repo.
      #
      # Runs as root (I_AM_BEING_UNSAFE_RUNNING_AS_ROOT): the upstream image's
      # default user can't write to /tmp/conf or /tmp/data unless a volume/user
      # is customized. Fine for a throwaway CI instance; would not be fine for
      # anything long-lived.
      #
      # The instance is published on the runner's port 3000 and reached as
      # `forgejo` (an /etc/hosts entry on the runner, a network alias inside
      # Docker), so FORGEJO_SDK_TEST_URL and ROOT_URL are the same string on
      # both sides. The federation tests start a peer inside the test process;
      # the instance reaches it through the Docker network's gateway address.
      - name: Start Forgejo
        env:
          FORGEJO_IMAGE: ${{ matrix.image }}
        run: |
          cat > "$RUNNER_TEMP/start-forgejo.sh" <<'EOF'
          mkdir -p /tmp/conf/
          mkdir -p /tmp/data/
          ssh-keygen -q -t ed25519 -N "" -C forgejo-sdk-test -f /tmp/conf/signing_key
          SECRET_KEY="$(forgejo generate secret SECRET_KEY)"
          INTERNAL_TOKEN="$(forgejo generate secret INTERNAL_TOKEN)"
          echo "I_AM_BEING_UNSAFE_RUNNING_AS_ROOT = true" > /tmp/conf/app.ini
          echo "[security]" >> /tmp/conf/app.ini
          echo "INTERNAL_TOKEN = ${INTERNAL_TOKEN}" >> /tmp/conf/app.ini
          echo "INSTALL_LOCK = true" >> /tmp/conf/app.ini
          echo "SECRET_KEY = ${SECRET_KEY}" >> /tmp/conf/app.ini
          echo "PASSWORD_COMPLEXITY = off" >> /tmp/conf/app.ini
          echo "DISABLE_GIT_HOOKS = false" >> /tmp/conf/app.ini
          echo "[database]" >> /tmp/conf/app.ini
          echo "DB_TYPE = sqlite3" >> /tmp/conf/app.ini
          echo "[repository]" >> /tmp/conf/app.ini
          echo "ROOT = /tmp/data/" >> /tmp/conf/app.ini
          echo "ENABLE_FLAGS = true" >> /tmp/conf/app.ini
          echo "[repository.signing]" >> /tmp/conf/app.ini
          echo "FORMAT = ssh" >> /tmp/conf/app.ini
          echo "SIGNING_KEY = /tmp/conf/signing_key.pub" >> /tmp/conf/app.ini
          echo "INITIAL_COMMIT = never" >> /tmp/conf/app.ini
          echo "CRUD_ACTIONS = never" >> /tmp/conf/app.ini
          echo "WIKI = never" >> /tmp/conf/app.ini
          echo "MERGES = never" >> /tmp/conf/app.ini
          echo "[server]" >> /tmp/conf/app.ini
          echo "ROOT_URL = http://forgejo:3000" >> /tmp/conf/app.ini
          echo "[quota]" >> /tmp/conf/app.ini
          echo "ENABLED = true" >> /tmp/conf/app.ini
          echo "[migrations]" >> /tmp/conf/app.ini
          echo "ALLOW_LOCALNETWORKS = true" >> /tmp/conf/app.ini
          echo "[federation]" >> /tmp/conf/app.ini
          echo "ENABLED = true" >> /tmp/conf/app.ini
          echo "INSECURE_ALLOW_INVALID_HOSTS = true" >> /tmp/conf/app.ini
          forgejo migrate -c /tmp/conf/app.ini
          forgejo admin user create --username=test01 --password=test01 --email=test01@forgejo.org --admin=true --must-change-password=false --access-token -c /tmp/conf/app.ini
          exec forgejo web -c /tmp/conf/app.ini
          EOF
          docker network create forgejo-net
          docker run -d --name forgejo --network forgejo-net --network-alias forgejo \
            -p 3000:3000 -v "$RUNNER_TEMP/start-forgejo.sh:/start-forgejo.sh:ro" \
            --entrypoint bash "$FORGEJO_IMAGE" /start-forgejo.sh
          echo "127.0.0.1 forgejo" | sudo tee -a /etc/hosts
          gateway=$(docker network inspect forgejo-net -f '{{ (index .IPAM.Config 0).Gateway }}')
          echo "FORGEJO_SDK_TEST_CALLBACK_HOST=${gateway}" >> "$GITHUB_ENV"

      # Wait for Forgejo to be healthy before running tests; fail if it never is.
      - name: Wait for Forgejo
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://forgejo:3000/api/v1/version; then
              exit 0
            fi
            echo "Waiting for Forgejo... ($i/60)"
            sleep 2
          done
          echo "Forgejo did not become healthy in time"
          docker logs forgejo || true
          exit 1

      # A forgejo-runner (host label, no Docker socket, no docker-in-docker)
      # so a dispatched workflow really executes: the artifact and job-log
      # routes only answer 2xx for a job that has run (issue #77). Those
      # routes exist from Forgejo 16.0.0, so only that leg needs it; the
      # other two would just carry an idle container. It is reached the same
      # way the test process reaches the instance: on forgejo-net, as
      # `forgejo`, which is also the ROOT_URL Forgejo hands to a job for the
      # artifact service. The script returns once the runner is up; the
      # tests poll for the job with their own deadline.
      - name: Start the test runner
        if: matrix.label == 'latest-stable'
        run: |
          RUNNER_CONTAINER=forgejo-runner bash scripts/start-test-runner.sh \
            forgejo http://forgejo:3000 forgejo-net -c /tmp/conf/app.ini
          echo "FORGEJO_SDK_TEST_RUNNER=true" >> "$GITHUB_ENV"

      # Observed 2026-09-22: all 3 legs timed out here, each stuck 8+
      # minutes on an HTTP round trip to this leg's own Forgejo service
      # container that never returned, past go test's default 10m ceiling
      # -- a runner/infra hang, not a regression (the same commit's
      # train-guard and lint jobs, and every unit test in this same job,
      # had already passed cleanly). Retrigger before assuming a real
      # failure; see the "ci: retrigger after a CI-infra hang" precedent.
      - run: make test

      # The coverage floor (COVERAGE_MIN=70, Makefile) only fails the train
      # PR (develop -> main). On a feature PR the number is still measured
      # and printed, but as a warning: the debt is visible without
      # blocking the PR, and gets collected all at once when the train
      # leaves.
      - name: Coverage
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            make coverage-check
          else
            make coverage-check \
              || echo "::warning::coverage below the floor; will fail the develop -> main PR"
          fi

      # The per-version evidence: which routes this leg actually exercised,
      # and with what result. The route-matrix job below turns the three
      # legs' reports into ROUTES.md.
      - name: Upload the route report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: route-report-${{ matrix.label }}
          path: forgejo/route-report.json
          if-no-files-found: error


  # Checks the route contract against what the legs actually did: ROUTES.md
  # (one line per route, one column per version) and the counters in
  # README.md have to match what the generator produces from the three
  # reports. Cheap job -- it only downloads three small JSON files and runs a
  # generator -- and with `needs:` it does not compete with the legs for
  # runner minutes.
  #
  # This job fails the build when:
  #   - a route has no evidence on some version and no declared reason in
  #     route-exceptions.json;
  #   - a route was called there and never answered 2xx (a masked
  #     regression: only a reason that explicitly covers failing evidence
  #     may stand in for it);
  #   - a request could not be attributed to any *Client method (a client
  #     built outside newTestClientOpts);
  #   - a route has no doc comment, so its description would be empty;
  #   - an exception uses a reason outside the closed set, omits the issue
  #     link its reason requires, or has been "todo" for over 90 days;
  #   - ROUTES.md or the README block differ from the generated output.
  #
  # Still to do by hand, once this has run green on a pull request: add
  # "route-matrix" to the branch protection of `main` alongside the three
  # `testing` legs. That is an administrative repo setting, not something
  # this file can do.
  route-matrix:
    needs: [testing]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOPROXY: "https://proxy.golang.org,direct"
      GO111MODULE: "on"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: forgejo/go.mod
          check-latest: true
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: route-report-*
          path: route-reports

      - name: Check the route contract
        run: |
          reports=$(find route-reports -name route-report.json -printf '%p ')
          test -n "$reports" || { echo "no route reports downloaded"; exit 1; }
          make check-routes ROUTE_REPORTS="$reports"

      # On failure this is what says how the committed files differ from the
      # evidence: regenerating locally needs all three versions, which a
      # contributor will not usually have to hand.
      - name: Upload the contract the evidence produces
        if: always()
        run: |
          reports=$(find route-reports -name route-report.json -printf '%p ')
          make route-matrix ROUTE_REPORTS="$reports" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: route-contract
          path: |
            ROUTES.md
            README.md
          if-no-files-found: error
