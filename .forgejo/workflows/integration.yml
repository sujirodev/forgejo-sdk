name: integration

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks need no Forgejo instance; they run alongside `testing`
  # (the self-hosted runner has capacity 2). golangci-lint's binary and
  # Go's own build/module caches are bind-mounted from the runner host
  # (see .forgejo/runner/entrypoint.sh's container.options) instead of
  # going through actions/cache/setup-go's own cache: the runner's cache
  # proxy is unreachable from job containers on this host, so those paths
  # are disabled below rather than left silently failing every run.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOPROXY: "https://proxy.golang.org,direct"
      GO111MODULE: "on"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25"
          check-latest: true
          cache: false

      # Every file that pins the Forgejo test-instance version must agree.
      - run: make check-forgejo-version
      - run: make vet
      - run: make ci-lint
      - run: make build
      - run: make test-unit

  # Job name is a required status check on `main`; keep it as `testing`.
  testing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOPROXY: "https://proxy.golang.org,direct"
      GO111MODULE: "on"
      FORGEJO_SDK_TEST_URL: "http://forgejo:3000"
      FORGEJO_SDK_TEST_USERNAME: "test01"
      FORGEJO_SDK_TEST_PASSWORD: "test01"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25"
          check-latest: true
          cache: false

      # Wait for Forgejo to be healthy before running tests; fail if it never is.
      - name: Wait for Forgejo
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://forgejo:3000/api/v1/version; then
              exit 0
            fi
            echo "Waiting for Forgejo... ($i/60)"
            sleep 2
          done
          echo "Forgejo did not become healthy in time"
          exit 1

      - run: make test

    services:
      # Disposable, single-run instance: it only ever serves this one job,
      # gets torn down with the container afterwards, and nothing in it is
      # reused across runs. SECRET_KEY/INTERNAL_TOKEN are generated fresh
      # below instead of being fixed values committed to the repo.
      #
      # Runs as root (I_AM_BEING_UNSAFE_RUNNING_AS_ROOT): the upstream
      # codeberg.org/forgejo/forgejo image's default user can't write to
      # /tmp/conf or /tmp/data unless the volume/user is customized, and
      # Forgejo Actions' `services:` block has no equivalent of Docker
      # Compose's `user:` to run the container as non-root instead. Fine
      # for a throwaway CI instance; would not be fine for anything
      # long-lived.
      forgejo:
        image: codeberg.org/forgejo/forgejo:15.0.1@sha256:bff07e43f5c84449e9dc6dca2c0a16c6f9eb285405d7f1bc631a360fd963f3fc
        cmd:
          - bash
          - -c
          - >-
            mkdir -p /tmp/conf/
            && mkdir -p /tmp/data/
            && SECRET_KEY="$(forgejo generate secret SECRET_KEY)"
            && INTERNAL_TOKEN="$(forgejo generate secret INTERNAL_TOKEN)"
            && echo "I_AM_BEING_UNSAFE_RUNNING_AS_ROOT = true" > /tmp/conf/app.ini
            && echo "[security]" >> /tmp/conf/app.ini
            && echo "INTERNAL_TOKEN = ${INTERNAL_TOKEN}" >> /tmp/conf/app.ini
            && echo "INSTALL_LOCK = true" >> /tmp/conf/app.ini
            && echo "SECRET_KEY = ${SECRET_KEY}" >> /tmp/conf/app.ini
            && echo "PASSWORD_COMPLEXITY = off" >> /tmp/conf/app.ini
            && echo "[database]" >> /tmp/conf/app.ini
            && echo "DB_TYPE = sqlite3" >> /tmp/conf/app.ini
            && echo "[repository]" >> /tmp/conf/app.ini
            && echo "ROOT = /tmp/data/" >> /tmp/conf/app.ini
            && echo "[server]" >> /tmp/conf/app.ini
            && echo "ROOT_URL = http://forgejo:3000" >> /tmp/conf/app.ini
            && echo "[quota]" >> /tmp/conf/app.ini
            && echo "ENABLED = true" >> /tmp/conf/app.ini
            && forgejo migrate -c /tmp/conf/app.ini
            && forgejo admin user create --username=test01 --password=test01 --email=test01@forgejo.org --admin=true --must-change-password=false --access-token -c /tmp/conf/app.ini
            && forgejo web -c /tmp/conf/app.ini
