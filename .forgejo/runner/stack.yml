version: "3.8"

# Self-hosted Forgejo runner registered against codeberg.org for
# sujirodev/forgejo-sdk (workflow uses runs-on: ubuntu-latest).
#
# This is the reviewed source of truth for the Portainer Swarm stack
# `codeberg-runner` (env id 3). It is deployed MANUALLY (Stacks ->
# codeberg-runner -> Editor -> paste + Update the stack); there is
# deliberately no CI workflow that applies this file automatically. A
# workflow with deploy credentials to the runner's own host would be a
# privilege-escalation path for anyone who can get a workflow-file change
# approved to run.
#
# Nothing sensitive lives here. The connection token is a Swarm secret
# (`codeberg_runner_conn_token`, external, created out of band) and is never
# an env var: a Swarm secret's value is never returned by the Docker API
# again, unlike env vars, which `docker service inspect` shows in cleartext.
# FORGEJO_RUNNER_CONN_UUID is a plain identifier per Forgejo's own docs, not
# a secret.
#
# Entrypoint behavior and version history: see ./entrypoint.sh (deployed as
# Swarm config `codeberg_runner_entrypoint_v12`, kept in sync with this
# file's `configs.codeberg_runner_entrypoint.name`).

services:
  runner:
    image: data.forgejo.org/forgejo/runner:13
    user: root
    command: ["/bin/sh", "/entrypoint.sh"]
    configs:
      - source: codeberg_runner_entrypoint
        target: /entrypoint.sh
        mode: 0555
    secrets:
      - source: codeberg_runner_conn_token
        target: forgejo_runner_conn_token
    environment:
      FORGEJO_RUNNER_INSTANCE_URL: "https://codeberg.org"
      FORGEJO_RUNNER_NAME: "${FORGEJO_RUNNER_NAME:-matheus-server-codeberg}"
      FORGEJO_RUNNER_LABELS: "${FORGEJO_RUNNER_LABELS:-ubuntu-latest:docker://catthehacker/ubuntu:act-22.04,docker:docker://catthehacker/ubuntu:act-22.04}"
      FORGEJO_RUNNER_CONN_URL: "${FORGEJO_RUNNER_CONN_URL:-}"
      FORGEJO_RUNNER_CONN_UUID: "${FORGEJO_RUNNER_CONN_UUID:-}"
      FORGEJO_RUNNER_REGISTRATION_TOKEN: "${FORGEJO_RUNNER_REGISTRATION_TOKEN:-}"
      FORGEJO_RUNNER_CAPACITY: "${FORGEJO_RUNNER_CAPACITY:-2}"
      DOCKER_HOST: "unix:///var/run/docker.sock"
    volumes:
      - codeberg_runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s

configs:
  codeberg_runner_entrypoint:
    external: true
    name: codeberg_runner_entrypoint_v12

secrets:
  codeberg_runner_conn_token:
    external: true

networks:
  default: {}

volumes:
  codeberg_runner_data:
