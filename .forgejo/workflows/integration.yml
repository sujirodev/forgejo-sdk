name: integration

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks need no Forgejo instance; they run alongside `testing`
  # (the self-hosted runner has capacity 2). golangci-lint's binary and
  # Go's own build/module caches are bind-mounted from the runner host
  # (see .forgejo/runner/entrypoint.sh's container.options) instead of
  # going through actions/cache/setup-go's own cache: the runner's cache
  # proxy is unreachable from job containers on this host, so those paths
  # are disabled below rather than left silently failing every run.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOPROXY: "https://proxy.golang.org,direct"
      GO111MODULE: "on"
    steps:
      # The self-hosted runner reuses /workspace/<owner>/<repo> between jobs.
      # When a job starts and that directory has no .git (it happens),
      # actions/checkout init's a fresh repository on top of whatever is
      # already there and checks out the ref -- which restores tracked files
      # but leaves the *previous* job's files behind as untracked leftovers.
      # A job then lints and tests files from another pull request: observed
      # on PR #31, whose lint failed on a forgejo/repo_refs_test.go that does
      # not exist on its branch at all. Wipe the workspace first.
      - name: Clean the shared workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: forgejo/go.mod
          check-latest: true
          cache: false

      # Every file that pins the Forgejo test-instance version must agree.
      - run: make check-forgejo-version
      - run: make check-test-instance-settings
      - run: make vet
      - run: make ci-lint
      - run: make build
      - run: make test-unit
      # Every exported *Client method (route) needs a test.
      - run: make check-route-coverage

  # Runs the integration suite against every Forgejo line the README
  # promises support for: both currently-supported LTS releases (Forgejo
  # ships one LTS per year, on its first release; the rest are "stable"
  # with ~3 months of support — see https://forgejo.org/releases/) plus the
  # newest stable, so "supports 11.0.10+" is something CI actually checks
  # instead of an unverified claim about the versions in between.
  #
  # With the matrix, the job name Forgejo Actions reports for each leg is
  # "testing (lts-11)", "testing (lts-15)", "testing (latest-stable)" — the
  # single "testing" name that used to be the required status check on
  # `main` no longer exists on its own. Branch protection needs updating to
  # require the three new names instead (administrative repo setting, not
  # something this workflow file can do by itself).
  #
  # The explicit `name:` below is what makes those names stable: without it
  # the runner names each leg after every matrix field, image digest
  # included ("testing (codeberg.org/forgejo/forgejo:11.0.16@sha256:...,
  # lts-11)"), so the status-check context would change on every Renovate
  # bump and the required check on `main` would never match again.
  #
  # fail-fast: true trades "know immediately which legs would have failed"
  # for "stop burning runner capacity the moment any leg is red": the first
  # failing leg cancels the other two still in flight.
  testing:
    name: testing (${{ matrix.label }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # renovate: versioning=regex:^(?<major>11)\.(?<minor>\d+)\.(?<patch>\d+)$
          - label: lts-11
            image: codeberg.org/forgejo/forgejo:11.0.16@sha256:946243edbab116d5bb78b73ea68af6f3d69229ba1b1ed958dd82c3481167f3e0
          # renovate: versioning=regex:^(?<major>15)\.(?<minor>\d+)\.(?<patch>\d+)$
          - label: lts-15
            image: codeberg.org/forgejo/forgejo:15.0.9@sha256:91a5310c86934339e16bd06b6078aada836e3d8935b2d70f6598108cbfaed5d1
          # No version-lock marker: this entry tracks the same release as
          # Makefile/README.md/forgejo/main_test.go and is bumped by the
          # same Renovate group ("forgejo test instance") as those three.
          - label: latest-stable
            image: codeberg.org/forgejo/forgejo:16.0.5@sha256:cf5f5ae6acf2ababca0ee3d255705b83a47f35b25e07fc931d694d60664053fe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOPROXY: "https://proxy.golang.org,direct"
      GO111MODULE: "on"
      FORGEJO_SDK_TEST_URL: "http://forgejo:3000"
      FORGEJO_SDK_TEST_USERNAME: "test01"
      FORGEJO_SDK_TEST_PASSWORD: "test01"
      # Names this leg in the route report TestMain writes, which is what
      # gives ROUTES.md one column per Forgejo version.
      FORGEJO_SDK_TEST_LABEL: ${{ matrix.label }}
    steps:
      # The self-hosted runner reuses /workspace/<owner>/<repo> between jobs.
      # When a job starts and that directory has no .git (it happens),
      # actions/checkout init's a fresh repository on top of whatever is
      # already there and checks out the ref -- which restores tracked files
      # but leaves the *previous* job's files behind as untracked leftovers.
      # A job then lints and tests files from another pull request: observed
      # on PR #31, whose lint failed on a forgejo/repo_refs_test.go that does
      # not exist on its branch at all. Wipe the workspace first.
      - name: Clean the shared workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: forgejo/go.mod
          check-latest: true
          cache: false

      # Wait for Forgejo to be healthy before running tests; fail if it never is.
      - name: Wait for Forgejo
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://forgejo:3000/api/v1/version; then
              exit 0
            fi
            echo "Waiting for Forgejo... ($i/60)"
            sleep 2
          done
          echo "Forgejo did not become healthy in time"
          exit 1

      - run: make test
      - run: make coverage-check

      # The per-version evidence: which routes this leg actually exercised,
      # and with what result. The route-matrix job below turns the three
      # legs' reports into ROUTES.md.
      - name: Upload the route report
        uses: forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: route-report-${{ matrix.label }}
          path: forgejo/route-report.json
          if-no-files-found: error

    services:
      # Disposable, single-run instance: it only ever serves this one job,
      # gets torn down with the container afterwards, and nothing in it is
      # reused across runs. SECRET_KEY/INTERNAL_TOKEN are generated fresh
      # below instead of being fixed values committed to the repo.
      #
      # Runs as root (I_AM_BEING_UNSAFE_RUNNING_AS_ROOT): the upstream
      # codeberg.org/forgejo/forgejo image's default user can't write to
      # /tmp/conf or /tmp/data unless the volume/user is customized, and
      # Forgejo Actions' `services:` block has no equivalent of Docker
      # Compose's `user:` to run the container as non-root instead. Fine
      # for a throwaway CI instance; would not be fine for anything
      # long-lived.
      forgejo:
        image: ${{ matrix.image }}
        cmd:
          - bash
          - -c
          - >-
            mkdir -p /tmp/conf/
            && mkdir -p /tmp/data/
            && SECRET_KEY="$(forgejo generate secret SECRET_KEY)"
            && INTERNAL_TOKEN="$(forgejo generate secret INTERNAL_TOKEN)"
            && echo "I_AM_BEING_UNSAFE_RUNNING_AS_ROOT = true" > /tmp/conf/app.ini
            && echo "[security]" >> /tmp/conf/app.ini
            && echo "INTERNAL_TOKEN = ${INTERNAL_TOKEN}" >> /tmp/conf/app.ini
            && echo "INSTALL_LOCK = true" >> /tmp/conf/app.ini
            && echo "SECRET_KEY = ${SECRET_KEY}" >> /tmp/conf/app.ini
            && echo "PASSWORD_COMPLEXITY = off" >> /tmp/conf/app.ini
            && echo "DISABLE_GIT_HOOKS = false" >> /tmp/conf/app.ini
            && echo "[database]" >> /tmp/conf/app.ini
            && echo "DB_TYPE = sqlite3" >> /tmp/conf/app.ini
            && echo "[repository]" >> /tmp/conf/app.ini
            && echo "ROOT = /tmp/data/" >> /tmp/conf/app.ini
            && echo "[server]" >> /tmp/conf/app.ini
            && echo "ROOT_URL = http://forgejo:3000" >> /tmp/conf/app.ini
            && echo "[quota]" >> /tmp/conf/app.ini
            && echo "ENABLED = true" >> /tmp/conf/app.ini
            && echo "[migrations]" >> /tmp/conf/app.ini
            && echo "ALLOW_LOCALNETWORKS = true" >> /tmp/conf/app.ini
            && forgejo migrate -c /tmp/conf/app.ini
            && forgejo admin user create --username=test01 --password=test01 --email=test01@forgejo.org --admin=true --must-change-password=false --access-token -c /tmp/conf/app.ini
            && forgejo web -c /tmp/conf/app.ini

  # Turns the legs' evidence into the route contract: ROUTES.md (one line per
  # route, one column per version) and the counters in README.md. Cheap job --
  # it only downloads three small JSON files and runs a generator -- and with
  # `needs:` it does not compete with the legs for runner capacity.
  #
  # Not enforcing yet (fase B of docs/PLANO-CONTRATO-ROTAS.md): it generates
  # and publishes the contract so the gaps are visible, but a gap does not
  # fail the build. Fase D flips this over, once the routes the first real run
  # flagged are closed or declared in route-exceptions.json:
  #   - drop `continue-on-error`,
  #   - swap `route-matrix` for `check-routes` (which also fails on a stale
  #     ROUTES.md / README block),
  #   - add this job to the branch protection of `main` alongside the three
  #     `testing` legs (an administrative repo setting, not something this
  #     file can do).
  route-matrix:
    needs: [testing]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOPROXY: "https://proxy.golang.org,direct"
      GO111MODULE: "on"
    steps:
      # Same reason as the other jobs: the runner's workspace is shared and
      # keeps the previous job's files unless it is emptied first.
      - name: Clean the shared workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: forgejo/go.mod
          check-latest: true
          cache: false

      - uses: forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          pattern: route-report-*
          path: route-reports

      - name: Generate the route contract
        continue-on-error: true
        run: |
          reports=$(find route-reports -name route-report.json -printf '%p ')
          test -n "$reports" || { echo "no route reports downloaded"; exit 1; }
          make route-matrix ROUTE_REPORTS="$reports"

      - name: Upload the generated contract
        uses: forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: route-contract
          path: |
            ROUTES.md
            README.md
          if-no-files-found: error
