name: Renovate

on:
  workflow_dispatch:
  # Run Renovate every night at 01:23.
  schedule:
    - cron: "23 01 * * *"

jobs:
  renovate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/renovatebot/renovate:43.55.6
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run Renovate
        run: renovate
        env:
          # Forgejo/Gitea specific settings
          RENOVATE_PLATFORM: "gitea"
          RENOVATE_ENDPOINT: "${{ vars.FORGEJO_API_URL || 'https://codeberg.org/api/v1/' }}"
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          REPOSITORIES: "mvdkleijn/forgejo-sdk"
          
          # GitHub token is still needed for fetching changelogs/metadata from github.com
          GITHUB_COM_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          
          # Logging and Author
          LOG_LEVEL: "info"
          RENOVATE_GIT_AUTHOR: "Forgejo SDK Renovate Bot <renovate@noreply.codeberg.org>"