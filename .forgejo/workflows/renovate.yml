name: Renovate

on:
  workflow_dispatch:
  # Run Renovate once a day at 03:23 UTC (self-hosted runner, keep it cheap).
  schedule:
    - cron: "23 3 * * *"

jobs:
  renovate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/renovatebot/renovate:44.105.4@sha256:e155ebea05260c388f12afa521fc23a485f119b32b0108ed9b17616f079e7519
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Renovate
        run: renovate
        env:
          # Forgejo/Gitea specific settings
          RENOVATE_PLATFORM: "forgejo"
          RENOVATE_ENDPOINT: "${{ vars.FORGEJO_API_URL || 'https://codeberg.org/api/v1/' }}"
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_REPOSITORIES: "MatheusAlves96/forgejo-sdk"
          
          # GitHub token is still needed for fetching changelogs/metadata from github.com
          GITHUB_COM_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          
          # Logging and Author
          LOG_LEVEL: "info"
          RENOVATE_GIT_AUTHOR: "Forgejo SDK Renovate Bot <renovate@noreply.codeberg.org>"