name: Renovate

on:
  workflow_dispatch:
  # Run Renovate once a day at 03:23 UTC.
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          # A personal access token, not GITHUB_TOKEN: the default token cannot
          # modify workflow files, and PRs it opens do not trigger CI.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: "info"
