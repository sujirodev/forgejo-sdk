name: release

# Runs after a train PR (develop -> main) is merged. Aggregates every PR
# reachable from the tip of develop that the merge commit incorporated
# (docs/PLANO-RELEASE-TRAIN.md): the semver bump is the highest bump among
# them, and the changelog/release body lists all of them grouped by
# .changelog.yml. A single-PR train (one PR since the last tag) behaves
# exactly like the old single-PR flow.
#
# MAJOR is intentionally never automatic: per docs/adr/0005-roadmap-to-v4.md,
# v4 is a deliberate, batched migration (module path bump + API unification),
# not something a single PR should trigger. A breaking-change signal from
# any PR in the train fails the job instead of tagging.
#
# Every step that computes a value assigns it to a shell variable first and
# only then writes $GITHUB_OUTPUT: `echo "x=$(cmd)" >> "$GITHUB_OUTPUT"` hides
# a failing `cmd` behind a succeeding `echo`, which is exactly how run #86
# reported success while the script had never run ("Permission denied").
#
# Order matters for re-runs: CHANGELOG.md is committed BEFORE the release is
# created. If the release step fails, a re-run finds no tag (so it computes
# the same one again) and the script skips the changelog section it already
# added, so nothing is duplicated. If the commit fails, nothing was created
# at all.
on:
  pull_request:
    types: [closed]
    branches: [main]
  # Recovery path: release an already-merged train PR whose automatic run
  # did not publish (or never ran); or, with dry_run, rehearse an open PR
  # into main without committing, tagging or publishing anything.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Number of a PR into main to release (merged), or to rehearse (dry_run)"
        required: true
      dry_run:
        description: "Compute bump, tag and changelog; commit and publish nothing"
        type: boolean
        default: false

# Serialize releases: if two PRs merge close together, the second run must
# see the tag the first one just created.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      # Saves the PR as JSON (from the event payload on merge, from the API
      # on a manual dispatch) and hands only its PATH to later steps via
      # $GITHUB_ENV. scripts/compute-release-version.sh reads
      # number/title/body/labels from that file.
      #
      # The title/body themselves must never go through $GITHUB_ENV: the
      # runner re-evaluates every value loaded from it as an expression on
      # every following step, so a PR body that merely quotes "${{ ... }}"
      # (as #22's did, run #88) aborts the whole job with a parse error.
      # DRY_RUN is safe to pass this way: it is always the literal "true"
      # or "false" from the workflow's own input, never PR-controlled text.
      #
      # dry_run relaxes the `merged` check: it lets an open PR into main be
      # rehearsed, using its head SHA (not yet a merge commit) as the tip
      # of develop.
      - name: Resolve the merged PR
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          EVENT_PR_JSON: ${{ toJSON(github.event.pull_request) }}
        run: |
          api="${GITHUB_API_URL:-https://codeberg.org/api/v1}"
          pr_file="${RUNNER_TEMP:-/tmp}/release-pr.json"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            curl -sSf -H "Authorization: token ${RELEASE_TOKEN}" \
              "${api}/repos/${GITHUB_REPOSITORY}/pulls/${INPUT_PR_NUMBER}" > "$pr_file"
            if [ "$(jq -r '.base.ref' "$pr_file")" != "main" ]; then
              echo "::error::PR #${INPUT_PR_NUMBER} does not target main"
              exit 1
            fi
            if [ "$INPUT_DRY_RUN" != "true" ] && [ "$(jq -r '.merged' "$pr_file")" != "true" ]; then
              echo "::error::PR #${INPUT_PR_NUMBER} is not merged into main (pass dry_run: true to rehearse an open PR)"
              exit 1
            fi
          else
            printf '%s' "$EVENT_PR_JSON" > "$pr_file"
          fi
          echo "resolved PR #$(jq -r '.number' "$pr_file"): $(jq -r '.title' "$pr_file")"
          echo "PR_JSON_FILE=${pr_file}" >> "$GITHUB_ENV"
          echo "DRY_RUN=${INPUT_DRY_RUN:-false}" >> "$GITHUB_ENV"

      # The end of the train's range: on a real merge, the tip of develop is
      # the merge commit's second parent (train-head fails if the commit
      # isn't a merge -- see docs/PLANO-RELEASE-TRAIN.md decision 4). In a
      # dry run the PR hasn't been merged yet, so there is no merge commit;
      # its own head SHA is develop's tip instead, and it's fetched
      # explicitly because a fresh `ref: main` checkout doesn't necessarily
      # have every other branch's tip commit locally.
      - name: Collect the PRs in this train
        id: train
        run: |
          api="${GITHUB_API_URL:-https://codeberg.org/api/v1}"
          base=$(bash scripts/compute-release-version.sh latest-tag)
          if [ "$DRY_RUN" = "true" ]; then
            head=$(jq -r '.head.sha' "$PR_JSON_FILE")
            git fetch --quiet origin "$head" || true
          else
            merge_sha=$(jq -r '.merge_commit_sha' "$PR_JSON_FILE")
            head=$(bash scripts/compute-release-version.sh train-head "$merge_sha")
          fi
          dir="${RUNNER_TEMP:-/tmp}/train"
          mkdir -p "$dir"
          numbers=$(bash scripts/compute-release-version.sh range-prs "${base}..${head}")
          test -n "$numbers" || { echo "::error::no PRs in ${base}..${head}"; exit 1; }
          for n in $numbers; do
            curl -sSf -H "Authorization: token ${RELEASE_TOKEN}" \
              "${api}/repos/${GITHUB_REPOSITORY}/pulls/${n}" > "${dir}/${n}.json"
          done
          echo "train ${base}..${head}: $(echo $numbers | tr '\n' ' ')"
          echo "head=${head}" >> "$GITHUB_OUTPUT"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      # pull_request `paths` filtering isn't documented/supported by Forgejo
      # Actions (only `push` is), so the check happens here instead of in
      # `on:`. A tree diff (not a commit walk) between the last tag and the
      # train's end, so it doesn't care how many commits or PRs are in
      # between, or what merge style produced them.
      - name: Check whether the SDK (forgejo/) changed
        id: changed
        run: |
          base=$(bash scripts/compute-release-version.sh latest-tag)
          if git diff --name-only "${base}..${{ steps.train.outputs.head }}" | grep -q '^forgejo/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing in forgejo/ since ${base}; nothing to release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version bump
        if: steps.changed.outputs.changed == 'true'
        id: bump
        run: |
          level=$(bash scripts/compute-release-version.sh aggregate-bump "${{ steps.train.outputs.dir }}")
          echo "bump level: ${level}"
          echo "level=${level}" >> "$GITHUB_OUTPUT"

      - name: Block automatic MAJOR release
        if: steps.changed.outputs.changed == 'true' && steps.bump.outputs.level == 'major'
        run: |
          PR_NUMBER=$(jq -r '.number' "$PR_JSON_FILE")
          echo "::error::a PR in this train (surfaced by the previous step; the train PR is #${PR_NUMBER}) signals a breaking change (label kind/breaking, 'feat!:'/'fix!:' or a 'BREAKING CHANGE:' footer). Automatic MAJOR bumps are not allowed: follow the manual process in docs/adr/0005-roadmap-to-v4.md before publishing a v4."
          exit 1

      - name: Compute next tag
        if: steps.changed.outputs.changed == 'true' && steps.bump.outputs.level != 'major'
        id: version
        env:
          LEVEL: ${{ steps.bump.outputs.level }}
        run: |
          tag=$(bash scripts/compute-release-version.sh next-tag "$LEVEL")
          echo "next tag: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # The body is written to a file, not passed through $GITHUB_OUTPUT ->
      # env, because a train's body holds dozens of PR titles: the same
      # class of risk that motivated PR_JSON_FILE above (a title quoting
      # "${{ ... }}" would be re-evaluated by the runner if it went through
      # an environment variable).
      - name: Update CHANGELOG.md
        if: steps.version.outputs.tag
        id: changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          changelog_sha=$(git rev-parse HEAD:CHANGELOG.md)
          body=$(bash scripts/compute-release-version.sh render-body "${{ steps.train.outputs.dir }}")
          if [ -z "$body" ]; then
            echo "::error::render-body produced an empty changelog (every PR in the train is skip-labeled) although forgejo/ changed. Remove a skip label, or release the offending PR alone via workflow_dispatch."
            exit 1
          fi
          bash scripts/compute-release-version.sh changelog-insert CHANGELOG.md "$TAG" "$body" "$GITHUB_REPOSITORY"
          if git diff --quiet -- CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          body_file="${RUNNER_TEMP:-/tmp}/release-body.md"
          printf '%s\n' "$body" > "$body_file"
          echo "sha=${changelog_sha}" >> "$GITHUB_OUTPUT"
          echo "body_file=${body_file}" >> "$GITHUB_OUTPUT"

      # Direct commit to main through the Contents API. The branch protection
      # on main must allow the token's user to push (push whitelist), or this
      # step fails with 403 and no release is created. Skipped in a dry run.
      - name: Commit CHANGELOG.md
        if: steps.changelog.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CHANGELOG_SHA: ${{ steps.changelog.outputs.sha }}
        run: |
          api="${GITHUB_API_URL:-https://codeberg.org/api/v1}"
          content_b64=$(base64 -w0 CHANGELOG.md)
          body=$(jq -n \
            --arg content "$content_b64" \
            --arg sha "$CHANGELOG_SHA" \
            --arg message "docs: update changelog for ${TAG}" \
            --arg branch "main" \
            '{content:$content, sha:$sha, message:$message, branch:$branch, signoff:true}')
          curl -sSf -X PUT \
            -H "Authorization: token ${RELEASE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body" \
            "${api}/repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md" >/dev/null
          echo "committed CHANGELOG.md for ${TAG}"

      # A release with a tag_name that doesn't exist yet creates the tag too,
      # pointed at the current head of main (which now includes the changelog
      # commit), so a separate "create tag" call isn't needed. Skipped in a
      # dry run.
      - name: Publish release
        if: steps.version.outputs.tag && github.event.inputs.dry_run != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          api="${GITHUB_API_URL:-https://codeberg.org/api/v1}"
          note=$(cat "${{ steps.changelog.outputs.body_file }}")
          body=$(jq -n \
            --arg tag "$TAG" \
            --arg name "$TAG" \
            --arg target "main" \
            --arg note "$note" \
            '{tag_name:$tag, name:$name, target_commitish:$target, body:$note}')
          curl -sSf -X POST \
            -H "Authorization: token ${RELEASE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body" \
            "${api}/repos/${GITHUB_REPOSITORY}/releases" >/dev/null
          echo "published ${TAG}"

      # Devolves the changelog commit to develop. Always fast-forward: the
      # tip of develop is an ancestor of the train's merge commit into main.
      # Fails if someone merged into develop between the train's merge and
      # this step -- the message says the sync is then manual. Skipped in a
      # dry run (there is no changelog commit to devolve).
      - name: Fast-forward develop to main
        if: steps.version.outputs.tag && github.event.inputs.dry_run != 'true'
        run: |
          git fetch origin main
          if git push "https://${RELEASE_TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git" \
               "origin/main:refs/heads/develop"; then
            echo "develop synced with main"
          else
            echo "::error::develop diverged from main; sync it by hand before the next train"
            exit 1
          fi

      - name: Dry-run summary
        if: steps.version.outputs.tag && github.event.inputs.dry_run == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "=== DRY RUN: would publish ${TAG} ==="
          cat "${{ steps.changelog.outputs.body_file }}"
          echo "=== nothing was committed, tagged, or published ==="
